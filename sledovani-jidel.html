<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sledování jídel – Lin's Happy Bowl</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--color-bg-light);
            min-height: 100vh;
            padding: 0;
        }

        .tracker-header {
            background: linear-gradient(135deg, var(--color-dark) 0%, #2d2d50 100%);
            color: #fff;
            padding: 32px 24px;
            text-align: center;
        }

        .tracker-header h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .tracker-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
        }

        .tracker-progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .progress-bar-wrap {
            flex: 1;
            max-width: 400px;
            height: 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--color-primary);
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-primary-light);
        }

        .tracker-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .tracker-table-wrap {
            background: var(--color-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .tracker-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tracker-table thead th {
            background: var(--color-secondary);
            color: #fff;
            padding: 14px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tracker-table thead th:nth-child(1) { width: 50px; }
        .tracker-table thead th:nth-child(2) { text-align: left; }
        .tracker-table thead th:nth-child(3) { width: 90px; }
        .tracker-table thead th:nth-child(4) { width: 90px; }

        .tracker-table tbody tr {
            border-bottom: 1px solid var(--color-border);
            transition: background 0.15s;
        }

        .tracker-table tbody tr:hover {
            background: var(--color-bg-warm);
        }

        .tracker-table tbody tr.completed {
            background: #f0faf4;
        }

        .tracker-table td {
            padding: 10px 12px;
            vertical-align: middle;
        }

        .tracker-table td:first-child {
            text-align: center;
            font-weight: 600;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        .meal-input {
            width: 100%;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--color-text);
            background: var(--color-bg);
            transition: border-color var(--transition);
        }

        .meal-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(232, 93, 38, 0.1);
        }

        .meal-input::placeholder {
            color: var(--color-text-muted);
        }

        .checkbox-cell {
            text-align: center;
        }

        .custom-checkbox {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .custom-checkbox input {
            display: none;
        }

        .custom-checkbox .check-mark {
            width: 28px;
            height: 28px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .custom-checkbox input:checked + .check-mark {
            border-color: var(--color-secondary);
            background: var(--color-secondary);
            color: #fff;
        }

        .custom-checkbox.lin-check input:checked + .check-mark {
            border-color: var(--color-primary);
            background: var(--color-primary);
        }

        .custom-checkbox .check-mark:hover {
            border-color: var(--color-text-muted);
            transform: scale(1.1);
        }

        .tracker-legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--color-text-light);
        }

        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .legend-dot.lin { background: var(--color-primary); }
        .legend-dot.me { background: var(--color-secondary); }

        .tracker-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--color-text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .tracker-header h1 { font-size: 1.4rem; }
            .tracker-table thead th { font-size: 0.75rem; padding: 10px 6px; }
            .tracker-table td { padding: 8px 6px; }
            .meal-input { padding: 6px 8px; font-size: 0.85rem; }
            .custom-checkbox .check-mark { width: 24px; height: 24px; font-size: 14px; }
            .tracker-table thead th:nth-child(3),
            .tracker-table thead th:nth-child(4) { width: 60px; }
        }
    </style>
</head>
<body>

    <div class="tracker-header">
        <h1>🍜 Sledování 100 jídel</h1>
        <p>Dohoda s Lin – 100 jídel za tento web</p>
        <div class="tracker-progress">
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <span class="progress-text" id="progressText">0 / 100</span>
        </div>
    </div>

    <div class="tracker-container">
        <div class="tracker-legend">
            <div class="legend-item">
                <div class="legend-dot lin"></div>
                <span>Potvrzení od Lin</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot me"></div>
                <span>Moje potvrzení</span>
            </div>
        </div>

        <div class="tracker-table-wrap" style="margin-top: 20px;">
            <table class="tracker-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jídlo</th>
                        <th>Lin ✓</th>
                        <th>Já ✓</th>
                    </tr>
                </thead>
                <tbody id="mealTableBody">
                </tbody>
            </table>
        </div>

        <div class="tracker-footer">
            <p>Data se ukládají automaticky v prohlížeči.</p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lhb_meal_tracker';
        const TOTAL_MEALS = 100;

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch {
                return {};
            }
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function updateProgress(data) {
            let completed = 0;
            for (let i = 1; i <= TOTAL_MEALS; i++) {
                const meal = data[i];
                if (meal && meal.linCheck && meal.myCheck) {
                    completed++;
                }
            }
            const pct = Math.round((completed / TOTAL_MEALS) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent = completed + ' / ' + TOTAL_MEALS;
        }

        function updateRowStyle(row, data, index) {
            const meal = data[index];
            if (meal && meal.linCheck && meal.myCheck) {
                row.classList.add('completed');
            } else {
                row.classList.remove('completed');
            }
        }

        function init() {
            const data = loadData();
            const tbody = document.getElementById('mealTableBody');
            const fragment = document.createDocumentFragment();

            for (let i = 1; i <= TOTAL_MEALS; i++) {
                const meal = data[i] || { name: '', linCheck: false, myCheck: false };
                const tr = document.createElement('tr');
                if (meal.linCheck && meal.myCheck) tr.classList.add('completed');

                tr.innerHTML = `
                    <td>${i}</td>
                    <td>
                        <input type="text" class="meal-input"
                               placeholder="Název jídla..."
                               value="${escapeHtml(meal.name)}"
                               data-index="${i}"
                               data-field="name">
                    </td>
                    <td class="checkbox-cell">
                        <label class="custom-checkbox lin-check">
                            <input type="checkbox"
                                   ${meal.linCheck ? 'checked' : ''}
                                   data-index="${i}"
                                   data-field="linCheck">
                            <span class="check-mark">✓</span>
                        </label>
                    </td>
                    <td class="checkbox-cell">
                        <label class="custom-checkbox my-check">
                            <input type="checkbox"
                                   ${meal.myCheck ? 'checked' : ''}
                                   data-index="${i}"
                                   data-field="myCheck">
                            <span class="check-mark">✓</span>
                        </label>
                    </td>
                `;
                fragment.appendChild(tr);
            }

            tbody.appendChild(fragment);
            updateProgress(data);

            // Event delegation
            tbody.addEventListener('change', function(e) {
                const target = e.target;
                const index = target.dataset.index;
                const field = target.dataset.field;
                if (!index || !field) return;

                const data = loadData();
                if (!data[index]) data[index] = { name: '', linCheck: false, myCheck: false };

                if (field === 'name') {
                    data[index].name = target.value;
                } else {
                    data[index][field] = target.checked;
                }

                saveData(data);
                updateProgress(data);
                updateRowStyle(target.closest('tr'), data, index);
            });

            tbody.addEventListener('input', function(e) {
                if (e.target.dataset.field === 'name') {
                    const data = loadData();
                    const index = e.target.dataset.index;
                    if (!data[index]) data[index] = { name: '', linCheck: false, myCheck: false };
                    data[index].name = e.target.value;
                    saveData(data);
                }
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        init();
    </script>

</body>
</html>
